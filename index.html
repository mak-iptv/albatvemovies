<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ALBATV Premium | Filma & Seriale HD Shqip + Jugosllav</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ALBATV">
    <meta name="application-name" content="ALBATV">
    <meta name="theme-color" content="#e50914">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="installButton" class="install-btn" style="display: none;">
    <i class="fas fa-download"></i> Instalo Aplikacionin
</div>
<div class="header">
    <div class="header-content">
        <div class="logo" onclick="showSection('home')">
            <i class="fas fa-play-circle logo-icon"></i>
            <div><div class="logo-text">ALBATV</div><div class="logo-subtitle">PREMIUM STREAMING</div></div>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="mainSearch" placeholder="Kërko film/serial...">
            <i class="fas fa-search search-icon" onclick="performSearch(document.getElementById('mainSearch').value, 'mainSearch')"></i>
        </div>
    </div>
    <div class="main-nav">
        <a class="nav-link active" onclick="showSection('home')"><i class="fas fa-home"></i> Kryefaqja</a>
        <a class="nav-link" onclick="showSection('movies')"><i class="fas fa-film"></i> Filma</a>
        <a class="nav-link" onclick="showSection('series')"><i class="fas fa-tv"></i> Serialet</a>
        <a class="nav-link" onclick="showSection('shqip')"><i class="fas fa-flag"></i> Shqip</a>
        <a class="nav-link" onclick="showSection('yu')"><i class="fas fa-star"></i> Jugosllav</a>
        <a class="nav-link" onclick="showSection('trending')"><i class="fas fa-fire"></i> Trending</a>
    </div>
</div>
<div id="home" class="section">
    <div class="hero-section">...</div> <!-- hero content - i shkurtuar për hapësirë -->
    <!-- Filma të Rinj SLIDER -->
    <div class="categories-section">
        <h2 class="section-title"><i class="fas fa-clock"></i> Filma të Rinj</h2>
        <div class="swiper new-movies-swiper">
            <div class="swiper-wrapper" id="newMoviesSliderWrapper">
                <div class="swiper-slide">Duke ngarkuar...</div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
    <div class="categories-section">...</div> <!-- pjesa tjetër -->
</div>
<!-- seksionet e tjera (movies, series, shqip, yu, trending) -->
<div class="player-modal" id="playerModal">...</div>
<div class="youtube-modal" id="youtubeModal">...</div>
<div class="footer">...</div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
