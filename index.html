<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ALBATV Premium | Filma & Seriale HD Shqip + Jugosllav</title>
    
    <!-- PWA Meta -->
    <meta name="theme-color" content="#e50914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ALBATV">
    <meta name="application-name" content="ALBATV">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<!-- I njëjti HTML si më parë, pa ndryshime -->
<div class="header">
    <div class="header-content">
        <div class="logo" onclick="showSection('home')">
            <i class="fas fa-play-circle logo-icon"></i>
            <div>
                <div class="logo-text">ALBATV</div>
                <div class="logo-subtitle">PREMIUM STREAMING</div>
            </div>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="mainSearch" placeholder="Kërko film/serial...">
            <i class="fas fa-search search-icon" onclick="performSearch(document.getElementById('mainSearch').value, 'mainSearch')"></i>
        </div>
    </div>
    <div class="main-nav">
        <a class="nav-link active" onclick="showSection('home')"><i class="fas fa-home"></i> Kryefaqja</a>
        <a class="nav-link" onclick="showSection('movies')"><i class="fas fa-film"></i> Filma</a>
        <a class="nav-link" onclick="showSection('series')"><i class="fas fa-tv"></i> Serialet</a>
        <a class="nav-link" onclick="showSection('shqip')"><i class="fas fa-flag"></i> Shqip</a>
        <a class="nav-link" onclick="showSection('yu')"><i class="fas fa-star"></i> Jugosllav</a>
        <a class="nav-link" onclick="showSection('trending')"><i class="fas fa-fire"></i> Trending</a>
    </div>
</div>

<!-- Seksionet (i njëjti kod si më parë) -->
<div id="home" class="section">...</div>
<div id="movies" class="section" style="display:none;">...</div>
<div id="series" class="section" style="display:none;">...</div>
<div id="shqip" class="section" style="display:none;">...</div>
<div id="yu" class="section" style="display:none;">...</div>
<div id="trending" class="section" style="display:none;">...</div>

<!-- Player Modals -->
<div class="player-modal" id="playerModal">...</div>
<div class="youtube-modal" id="youtubeModal">...</div>

<div class="footer">...</div>

<script src="script.js"></script>
<script>
    // Regjistrimi i Service Worker për PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('Service Worker registered:', reg);
            }).catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        });
    }
</script>
</body>
</html>
